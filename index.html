<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amatya Sharma</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Amatya Sharma">
  <link rel="icon" href="images/coffee.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400..700&display=swap">

  <style>
    :root {
      --site-font: 'Alegreya Sans', Verdana, Helvetica, sans-serif;
      --page-bg: #fffdf8;
      --body-text: #242424;
      --muted-text: #667466;
      --sage: #2f855a;
      --sage-dark: #234923;
      --coffee: #8a5c3b;
      --coffee-dark: #5c4033;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem;
      font-family: var(--site-font);
      color: var(--body-text);
      background:
        radial-gradient(circle at 25% 20%, rgba(47, 133, 90, 0.07), transparent 28%),
        radial-gradient(circle at 75% 80%, rgba(138, 92, 59, 0.07), transparent 30%),
        var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      width: min(480px, 100%);
    }

    .profile-photo {
      width: min(150px, 42vw);
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.1rem, 5vw, 3rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .page-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(280px, 100%);
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--body-text);
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(120, 120, 120, 0.18);
      transition: color 0.18s ease, border-color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
    }

    .page-link:hover,
    .page-link:focus-visible {
      transform: translateY(-1px);
      outline: none;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.84);
    }

    .page-link.professional:hover,
    .page-link.professional:focus-visible {
      color: var(--sage-dark);
      border-color: rgba(47, 133, 90, 0.38);
    }

    .page-link.personal:hover,
    .page-link.personal:focus-visible {
      color: var(--coffee-dark);
      border-color: rgba(138, 92, 59, 0.40);
    }

    .small-note {
      margin-top: 18px;
      color: var(--muted-text);
      font-size: 0.95rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 1.25rem;
      }

      main {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }

      .page-link:hover,
      .page-link:focus-visible {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main aria-label="Landing page">
    <img
      src="images/circle_cropped_whiteshirt_aaysharma.png"
      alt="Amatya Sharma"
      class="profile-photo"
    >

    <h1>Amatya Sharma</h1>

    <nav class="links" aria-label="Choose a page">
      <a class="page-link professional" href="professional.html">Professional</a>
      <a class="page-link personal" href="aboutme.html">Personal</a>
    </nav>

    <!-- <div class="small-note">professional / personal</div> -->
  </main>
</body>
</html>
